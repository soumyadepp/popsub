[package]
name = "popsub_scenarios"
version = "0.1.0"
edition = "2024"
description = "The scenario suite every PopSub client library must pass, and the Rust client's driver"
license = "Apache-2.0"

[[bin]]
name = "popsub-scenarios"
path = "src/main.rs"

[[bin]]
name = "popsub-sdk-driver"
path = "src/bin/popsub-sdk-driver.rs"

[dependencies]
popsub_auth = { path = "../popsub_auth" }
popsub_broker = { path = "../popsub_broker" }
popsub_config = { path = "../popsub_config" }
popsub_protocol = { path = "../popsub_protocol" }
popsub_sdk = { path = "../popsub_sdk" }
popsub_storage = { path = "../popsub_storage" }
popsub_transport = { path = "../popsub_transport" }
clap = { version = "4.3", features = ["derive"] }
serde_json = "1"
tempfile = "3.20.0"
tokio = { version = "1.46.1", features = ["full"] }
uuid = { version = "1.8", features = ["v4"] }
