[package]
name = "popsub_auth"
version = "0.1.0"
edition = "2024"
description = "Authentication and authorization module for PopSub"
license = "MIT"

[dependencies]
# JWT handling
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Password hashing
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"

# Async runtime
tokio = { version = "1", features = ["sync"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
thiserror = "2"

# Internal crates
popsub_utils = { path = "../popsub_utils" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
