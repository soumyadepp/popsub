[package]
name = "popsub"
version = "0.3.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
popsub_broker = { path = "../popsub_broker" }
popsub_connection = { path = "../popsub_connection" }
popsub_config = { path = "../popsub_config" }
popsub_protocol = { path = "../popsub_protocol" }
popsub_sdk = { path = "../popsub_sdk" }
popsub_storage = { path = "../popsub_storage" }
popsub_transport = { path = "../popsub_transport" }
popsub_utils = { path = "../popsub_utils" }

tokio = { version = "1.46.1", features = ["full"] }
tracing-subscriber = "0.3"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"
tracing = "0.1"
clap = { version = "4.3", features = ["derive"] }
rpassword = "7"


[dev-dependencies]
popsub_auth = { path = "../popsub_auth" }
tempfile = "3.20.0"
