[package]
name = "popsub_storage"
version = "0.1.0"
edition = "2024"
description = "Topic logs, subscription cursors and pluggable storage backends for PopSub"
license = "Apache-2.0"
publish = false

[features]
default = []
conformance = ["tokio/rt-multi-thread"]

[dependencies]
async-trait = "0.1"
crc32fast = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3.20.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
