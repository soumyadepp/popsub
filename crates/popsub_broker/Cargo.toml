[package]
name = "popsub_broker"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
chrono = { version = "0.4.41", features = ["serde"] }
itoa = "1"
ahash = "0.8"
parking_lot = "0.12"

popsub_connection = { path = "../popsub_connection" }
popsub_config = { path = "../popsub_config" }
popsub_protocol = { path = "../popsub_protocol" }
popsub_storage = { path = "../popsub_storage" }
popsub_utils = { path = "../popsub_utils" }
tokio = { version = "1.46.1", features = ["full"] }
tungstenite = "0.28.0"
tracing = "0.1"
