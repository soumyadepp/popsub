[package]
name = "popsub_transport"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["full"] }
tokio-tungstenite = "0.28.0"
tungstenite = "0.28.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
jsonwebtoken = "9.3.1"
futures-util = "0.3.31"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tracing = "0.1.41"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

popsub_auth = { path = "../popsub_auth" }
popsub_broker = { path = "../popsub_broker" }
popsub_connection = { path = "../popsub_connection" }
popsub_config = { path = "../popsub_config" }
popsub_storage = { path = "../popsub_storage" }
popsub_protocol = { path = "../popsub_protocol" }
popsub_ratelimit = { path = "../popsub_ratelimit" }
popsub_utils = { path = "../popsub_utils" }

[dev-dependencies]
tracing-subscriber = "0.3"
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "testing"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tempfile = "3.20.0"
