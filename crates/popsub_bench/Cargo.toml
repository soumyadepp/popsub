[package]
name = "popsub_bench"
version = "0.1.0"
edition = "2024"
description = "Load generator that measures a PopSub server's throughput and latency"
license = "Apache-2.0"
publish = false

[[bin]]
name = "popsub-bench"
path = "src/main.rs"

[dependencies]
clap = { version = "4.3", features = ["derive"] }
futures-util = "0.3.31"
hdrhistogram = { version = "7", default-features = false }
popsub_protocol = { path = "../popsub_protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.20.0"
tokio = { version = "1.46.1", features = ["full"] }
tokio-tungstenite = "0.28.0"
