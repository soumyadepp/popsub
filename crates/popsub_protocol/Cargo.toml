[package]
name = "popsub_protocol"
version = "0.1.0"
edition = "2024"
description = "The PopSub WebSocket protocol: every frame clients and the server exchange"
license = "Apache-2.0"

[features]
default = []
schema = ["dep:schemars", "dep:serde_json"]

[dependencies]
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
serde_json = "1"
