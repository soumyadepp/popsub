[package]
name = "popsub_protocol"
version = "0.2.0"
edition = "2024"
description = "The PopSub WebSocket protocol: every frame clients and the server exchange"
license = "Apache-2.0"
repository = "https://github.com/soumyadepp/popsub"
homepage = "https://popsub.dev"
readme = "README.md"
exclude = ["CLAUDE.md"]
documentation = "https://docs.rs/popsub_protocol"
keywords = ["pubsub", "websocket", "messaging", "protocol"]
categories = ["network-programming", "encoding"]

[features]
default = []
schema = ["dep:schemars", "dep:serde_json"]

[dependencies]
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
serde_json = "1"
