name: Clients

on:
  push:
    branches: ["main", "feat/*", "feature/*", "fix/*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-scenarios-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-scenarios-
      - name: Build the scenario suite
        run: cargo build -p popsub_scenarios
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - name: Install, type check, lint, format check, test and build
        working-directory: clients/typescript
        run: |
          npm ci
          npm run check
          npm run build
          npm pack --dry-run
      - name: Run the scenario suite
        run: target/debug/popsub-scenarios --driver "node clients/typescript/dist/driver.js"
