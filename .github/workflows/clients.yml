name: Clients

on:
  push:
    branches: ["main", "feat/*", "feature/*", "fix/*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-scenarios-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-scenarios-
      - name: Build the scenario suite
        run: cargo build -p popsub_scenarios
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - name: Install, type check, lint, format check, test and build
        working-directory: clients/typescript
        run: |
          npm ci
          npm run check
          npm run build
          npm pack --dry-run
      - name: Run the scenario suite
        run: target/debug/popsub-scenarios --driver "node clients/typescript/dist/driver.js"

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-scenarios-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-scenarios-
      - name: Build the scenario suite
        run: cargo build -p popsub_scenarios
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Format, lint, type check and test
        working-directory: clients/python
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest
      - name: Build the package
        working-directory: clients/python
        run: uv build
      - name: Run the scenario suite
        run: target/debug/popsub-scenarios --driver "uv run --project clients/python python -m popsub._driver"

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-scenarios-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-scenarios-
      - name: Build the scenario suite
        run: cargo build -p popsub_scenarios
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: clients/go/go.sum
      - name: Format, vet, staticcheck, race tests and build the driver
        if: matrix.go == 'stable'
        working-directory: clients/go
        run: make check
      - name: Format, vet, race tests and build the driver on the oldest supported Go
        if: matrix.go != 'stable'
        working-directory: clients/go
        env:
          GOTOOLCHAIN: local
        run: make fmt-check vet test build
      - name: Run the scenario suite
        run: target/debug/popsub-scenarios --driver "clients/go/bin/popsub-driver"
