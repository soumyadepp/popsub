[project]
name = "popsub"
version = "0.1.0"
description = "Asyncio client for the PopSub WebSocket publish/subscribe broker."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "PopSub contributors" }]
keywords = ["pubsub", "websocket", "asyncio", "messaging", "popsub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "websockets>=16.0",
]

[project.urls]
Homepage = "https://github.com/soumyadepp/popsub"
Repository = "https://github.com/soumyadepp/popsub"
Documentation = "https://github.com/soumyadepp/popsub/tree/main/clients/python#readme"
Issues = "https://github.com/soumyadepp/popsub/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/popsub"]

[tool.hatch.build.targets.sdist]
only-include = ["src/popsub", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]
mypy_path = "src"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "D", "ANN", "N"]
ignore = [
    # ANN401: protocol frames are JSON objects decoded with the json module, so their values are Any by nature.
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# PLR2004: tests compare against literal seqs, counts and close codes; naming each one would hide what is checked.
# PLC0415: tests import private helpers inside the test that uses them, to keep each test self-contained.
"tests/**" = ["PLR2004", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6
