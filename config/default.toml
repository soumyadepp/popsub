# PopSub default configuration
[server]
host = "127.0.0.1"
port = 8080
jwt_secret = "a_very_secret_key"
jwt_expiration_hours = 24
username = "admin"
password = "password"
allow_registration = false
registration_role = "none"
heartbeat_secs = 30
idle_timeout_secs = 90
max_payload_bytes = 1048576
outbound_queue_bytes = 16777216
trusted_proxies = []

[broker]
max_connections = 1000
ack_timeout_ms = 5000
max_retries = 5
max_inflight = 100

[storage]
backend = "file"
path = "pubsub_data"
durability = "buffered"
session_expiry_secs = 86400

[storage.retention]
max_messages = 1000
max_age_secs = 3600
max_bytes = 67108864

[limits]
login_attempts = 5
login_lockout_secs = 300
address_login_attempts = 20
address_lockout_secs = 900
max_lockout_secs = 3600
registrations_per_hour = 5
publish_per_second = 100
publish_burst = 50
