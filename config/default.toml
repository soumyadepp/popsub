# PopSub default configuration
[server]
host = "127.0.0.1"
port = 8080
jwt_secret = "a_very_secret_key"
jwt_expiration_hours = 24
username = "admin"
password = "password"
allow_registration = false
registration_role = "none"
heartbeat_secs = 30
idle_timeout_secs = 90

[broker]
max_connections = 1000
ack_timeout_ms = 5000
max_retries = 5
max_inflight = 100

[storage]
backend = "file"
path = "pubsub_data"
durability = "buffered"
session_expiry_secs = 86400

[storage.retention]
max_messages = 1000
max_age_secs = 3600
max_bytes = 67108864
